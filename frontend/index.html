<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinity Customizations — Turn Your Memories Into Something Special</title>
    <meta name="description" content="Thoughtfully personalized gifts, premium photo frames, custom magazines, polaroids & bespoke hampers crafted with care." />
    <meta name="theme-color" content="#071A2F" />

    <!-- Favicons (High-Contrast White Background for Dark & Light Tabs) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />

    <!-- Preload Critical LCP Hero Image (Celebration Gift Hamper) -->
    <link rel="preload" as="image" href="/images/hero-hamper-optimized.webp" fetchpriority="high" type="image/webp" />

    <!-- Google Fonts: Manrope (400, 500, 600, 700, 800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />

    <!-- Error Catcher to prevent silent blank white screens -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('Window error captured:', e);
        var errBox = document.getElementById('runtime-error-banner');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'runtime-error-banner';
          errBox.style = 'position:fixed;top:0;left:0;right:0;background:#991B1B;color:#fff;padding:16px 24px;z-index:9999999;font-family:monospace;font-size:13px;line-height:1.5;box-shadow:0 4px 20px rgba(0,0,0,0.3);';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<strong>Application Error:</strong> ' + (e.message || 'Unknown runtime error') + 
          (e.filename ? '<br><small>' + e.filename + ':' + e.lineno + '</small>' : '') +
          (e.error && e.error.stack ? '<pre style="margin-top:8px;max-height:200px;overflow:auto;background:rgba(0,0,0,0.2);padding:8px;border-radius:4px;">' + e.error.stack + '</pre>' : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection captured:', e);
      });
    </script>
  </head>
  <body class="bg-[#FAF8F4] text-[#071A2F]">
    <div id="root" style="background-color: #FAF8F4; min-height: 100vh;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
